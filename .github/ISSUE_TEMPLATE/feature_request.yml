name: Feature request
description: Propose a source-backed improvement to the focused CLI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete tracing problem cannot be solved today?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Primary sources and user evidence
      description:
        Link the official specification and independent evidence of demand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful solution
      description: Describe the narrow behavior and expected CLI output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
